<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GAN接続デバッグ</title>
</head>
<body>
    <h1>GAN接続デバッグ</h1>
    <input type="text" id="macInput" value="AB:12:34:62:31:FE">
    <button id="connectBtn">接続する</button>
    <div id="status">未接続</div>

    <script type="module">
        import { connectGanCube } from 'https://esm.sh/gan-web-bluetooth';

        const macInput = document.getElementById('macInput');
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            const mac = macInput.value.trim();
            statusDiv.textContent = '接続中...';

            try {
                const conn = await connectGanCube(async () => mac);
                statusDiv.textContent = '接続成功！キューブを回してください（F12のコンソールを確認）';
                console.log('Cube Connected object:', conn);

                // すべてのイベントを無条件でコンソールに出力する
                conn.events$.subscribe((event) => {
                    console.log('受信したイベント:', event);
                });

            } catch (err) {
                console.error('接続エラー:', err);
                statusDiv.textContent = 'エラー: ' + err.message;
            }
        });
    </script>
</body>
</html>
